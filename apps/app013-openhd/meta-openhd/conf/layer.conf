# Private development layer: explicitly included by this app's kas config.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "q6a-openhd"
BBFILE_PATTERN_q6a-openhd := "^${LAYERDIR}/"
BBFILE_PRIORITY_q6a-openhd = "9"
LAYERDEPENDS_q6a-openhd = "core qcom-apps"
LAYERSERIES_COMPAT_q6a-openhd = "wrynose"
Q6A_OPENHD_LAYERDIR := "${LAYERDIR}"
LICENSE_PATH += "${@d.getVar('Q6A_OPENHD_LAYERDIR') + '/licenses' if d.getVar('QCOM_APP') == 'app013-openhd' else ''}"
