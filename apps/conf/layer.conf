# We have a conf and classes directory, add to BBPATH.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qcom-apps"
BBFILE_PATTERN_qcom-apps := "^${LAYERDIR}/"
BBFILE_PRIORITY_qcom-apps = "8"

LAYERDEPENDS_qcom-apps = "core"
LAYERSERIES_COMPAT_qcom-apps = "wrynose"

QCOM_APPS_DIR := "${LAYERDIR}"
QCOM_APP ??= ""
QCOM_APP_IMAGE ??= ""

# image.bbclass consumes IMAGE_CLASSES; ordinary recipes do not inherit this
# integration class, which keeps an unselected application out of their task
# signatures.
IMAGE_CLASSES += "qcom-app-image"

addpylib ${LAYERDIR}/lib qcom_apps
