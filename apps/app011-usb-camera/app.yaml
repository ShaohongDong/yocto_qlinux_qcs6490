# SPDX-License-Identifier: MIT
schema_version: 1
name: app011-usb-camera
summary: USB camera desktop preview with device and mode selection
license:
  expression: MIT
  files:
  - path: LICENSE
    md5: 849abeca484cc467659d7993d61f92d5
inputs:
- LICENSE
- README.md
- CMakeLists.txt
- src
- data
- scripts
- tests
build:
  system: cmake
  source: .
  options:
  - -DBUILD_TESTING=OFF
check:
- /usr/bin/usb-camera
- --self-test
dependencies:
  build:
  - pkgconfig-native
  - gtk+3
  - gstreamer1.0
  - gstreamer1.0-plugins-base
  runtime:
  - gstreamer1.0-plugins-base-app
  - gstreamer1.0-plugins-base-videoconvertscale
  - gstreamer1.0-plugins-good-video4linux2
  - gstreamer1.0-plugins-good-jpeg
  - ttf-wqy-zenhei
machines:
  radxa-dragon-q6a:
    kernel_providers:
    - linux-qcom
    images:
      default: qcom-multimedia-proprietary-efi-sd-image
      allowed:
      - qcom-multimedia-proprietary-efi-sd-image
kernel:
  config: []
  patches: []
  device_tree:
    files: []
    patches: []
  modules: []
services: []
