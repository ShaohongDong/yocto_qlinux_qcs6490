# SPDX-License-Identifier: MIT
schema_version: 1
name: app008-human-tracker
summary: Q6A NPU human pose and ByteTrack motion tracking with GUI and CLI
license:
  expression: MIT
  files:
  - path: LICENSE
    md5: 849abeca484cc467659d7993d61f92d5
inputs: [LICENSE, README.md, CMakeLists.txt, src, tests, data, scripts, third_party]
build:
  system: cmake
  source: .
  options: [-DBUILD_TESTING=OFF]
check: [/usr/bin/human-tracker, --self-test]
dependencies:
  build: [gtk+3, gstreamer1.0, gstreamer1.0-plugins-base, qairt-sdk, libeigen]
  runtime:
  - qairt-sdk
  - qairt-sdk-hexagon-v68
  - gstreamer1.0-plugins-base-app
  - gstreamer1.0-plugins-base-playback
  - gstreamer1.0-plugins-base-videoconvertscale
  - gstreamer1.0-plugins-good-isomp4
  - gstreamer1.0-plugins-good-video4linux2
  - gstreamer1.0-plugins-bad-videoparsersbad
machines:
  radxa-dragon-q6a:
    kernel_providers: [linux-qcom]
    images:
      default: qcom-multimedia-proprietary-efi-sd-image
      allowed: [qcom-multimedia-proprietary-efi-sd-image]
kernel:
  config: []
  patches: []
  device_tree:
    files: []
    patches: []
  modules: []
services: []
