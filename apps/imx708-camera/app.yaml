# SPDX-License-Identifier: MIT
schema_version: 1
name: imx708-camera
summary: Q6A CAM3 IMX708 camera with native RAW preview and optional CamX backend
license:
  expression: MIT
  files:
  - path: LICENSE
    md5: 849abeca484cc467659d7993d61f92d5
inputs:
- LICENSE
- README.md
- CMakeLists.txt
- src
- data
- docs
- tests
- scripts
- kernel
- systemd
build:
  system: cmake
  source: .
  options:
  - -DIMX708_WITH_QMMF=ON
  - -DBUILD_TESTING=OFF
check: [/usr/bin/imx708-camera, --self-test]
dependencies:
  build: [gtk+3, gstreamer1.0, gstreamer1.0-plugins-base, camera-service]
  runtime:
  - python3-core
  - kmod
  - kernel-module-i2c-gpio
  - kernel-module-imx708
  - kernel-module-qcom-camss
  - media-ctl
  - imx708-sensor-core
  - ttf-wqy-zenhei
  - camera-service
  - camxlib-kodiak
  - camxfirmware-kodiak
  - camx-dlkm
  - gst-plugins-imsdk-prop-qticamsrc
  - gstreamer1.0-plugins-good-gtk
  - gstreamer1.0-plugins-good-video4linux2
  - gstreamer1.0-plugins-good-isomp4
  - gstreamer1.0-plugins-bad-videoparsersbad
  - gstreamer1.0-plugins-base-videoconvertscale
  - gstreamer1.0-plugins-base-app
machines:
  radxa-dragon-q6a:
    kernel_providers: [linux-qcom]
    images:
      default: qcom-multimedia-proprietary-efi-sd-image
      allowed:
      - qcom-multimedia-proprietary-efi-sd-image
      - qcom-multimedia-proprietary-efi-ufs-4k-image
# Native GPIO I2C/CAMSS integration; this does not enable CamX sensor assets.
kernel:
  config: [kernel/config/native-camera.cfg]
  patches: []
  device_tree:
    files:
    - source: kernel/dts/q6a-imx708-native.dtsi
      target: arch/arm64/boot/dts/qcom/q6a-imx708-native.dtsi
    patches: [kernel/patches/0001-q6a-enable-imx708-native.patch]
  modules: []
services:
- source: systemd/imx708-native-drivers.service
  enable: true
  wanted_by: multi-user.target
- source: systemd/imx708-native-preview.service
  enable: true
  wanted_by: graphical.target
