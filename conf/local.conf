# WARNING: this configuration has been automatically generated and in
# most cases should not be edited. If you need more flexibility than
# this configuration provides, it is strongly suggested that you set
# up a proper instance of the full build system and use that instead.

INHERIT += "buildstats-summary"
INHERIT += "buildhistory"
INHERIT += "rm_work"
INHERIT += "image-buildinfo"
MIRRORS:append = " \
git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
"
KERNEL_CMDLINE_EXTRA:append = " qcom_scm.download_mode=1"
KERNEL_CMDLINE_EXTRA:append = " quiet systemd.tty.term.console=linux"
BB_DISKMON_DIRS ??= "\
  STOPTASKS,${TMPDIR},1G,100K \
  STOPTASKS,${DL_DIR},1G,100K \
  STOPTASKS,${SSTATE_DIR},1G,100K \
  STOPTASKS,/tmp,100M,100K \
  HALT,${TMPDIR},100M,1K \
  HALT,${DL_DIR},100M,1K \
  HALT,${SSTATE_DIR},100M,1K \
  HALT,/tmp,10M,1K"
DISTRO_FEATURES:append = " efi pam pni-names"
EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
IMAGE_ROOTFS_EXTRA_SPACE = "307200"
WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
BB_GENERATE_MIRROR_TARBALLS = "1"
OS_RELEASE_FIELDS:append = " BUILD_ID"
BUILD_ID ?= "local-${DATETIME}"
SKIP_META_VIRT_SANITY_CHECK = "1"
MACHINE ??= "radxa-dragon-q6a"
DISTRO ??= "qcom-distro"
BBMULTICONFIG ?= ""

TMPDIR = "${TOPDIR}/tmp"
DL_DIR = "${TOPDIR}/downloads"
INHERIT += "uninative"
UNINATIVE_CHECKSUM[x86_64] = "2b63a078c26535e0786e87f81ae69509df30f4dce40693004c527bd5e4ab2b85"

CONF_VERSION = "2"

# Limit concurrent tasks and compiler jobs after the host OOM incident.
BB_NUMBER_THREADS = "16"
PARALLEL_MAKE = "-j16"

INHERIT:remove = "buildhistory"
CONNECTIVITY_CHECK_URIS = ""

SIGGEN_LOCKEDSIGS_SSTATE_EXISTS_CHECK = "none"

SIGGEN_LOCKEDSIGS_TASKSIG_CHECK = "warn"

BB_HASHCONFIG_IGNORE_VARS:append = " SIGGEN_UNLOCKED_RECIPES"

BB_SETSCENE_ENFORCE_IGNORE_TASKS = "%:* *:do_shared_workdir *:do_rm_work wic-tools:* *:do_addto_recipe_sysroot"

BUILDCFG_HEADER = ""

METADATA_REVISION:qcom-distro = "06dd66e6220e5ce4ed4b9af4d8231ae5f0a8ce80"

# Provide a flag to indicate we are in the EXT_SDK Context
WITHIN_EXT_SDK = "1"

require conf/locked-sigs.inc
require conf/unlocked-sigs.inc

# Development OTA release with root/root login.
QCOM_OTA_VERSION = "2.0.5"
