#@TYPE: Machine
#@NAME: Radxa Dragon Q8B
#@DESCRIPTION: Machine configuration for the Radxa Dragon Q8B with SC8280XP

require conf/machine/include/qcom-sc8280xp.inc

MACHINE_FEATURES += "efi m2connector pci"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom"
PREFERRED_VERSION_linux-qcom = "7.0.11%"

KERNEL_DEVICETREE ?= " \
    qcom/sc8280xp-radxa-dragon-q8b.dtb \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-radxa-dragon-q8b-firmware \
    packagegroup-radxa-dragon-q8b-hexagon-dsp-binaries \
"

# The Q8B SPI NOR contains the Qualcomm boot chain and UEFI. OS images start
# at an EFI System Partition and deliberately omit qcomflash boot firmware.
